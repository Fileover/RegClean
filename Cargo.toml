[package]
name = "regclean"
version = "0.1.0"
edition = "2024"
default-run = "regclean"
build = "build.rs"
description = "Portable, reversible Windows Registry cleaner with a CLI and native GUI"
license = "MIT"
repository = "https://github.com/Fileover/RegClean"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Environment",
] }
winreg = "0.56.0"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
